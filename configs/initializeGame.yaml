scenario_name: "warehouse-smoke-test"
simulator_mode: "2d"                 # "2d" or "3d_preview"; F2 toggles at runtime
car_png: "../assets/car.png"
window_size: "1980x1080"
initial_position: "100x100"

# Robotics engineer mode: prototype navigation against repeatable, noisy sensors
# without needing a full Gazebo/Isaac stack for early algorithm smoke tests.
robotics_overlay: true                 # F1 toggles range rays/obstacles at runtime
gui_overlay: true                      # TAB toggles the in-window help/status panel

# User-authored 2D scenario obstacles: "x y width height" encoded as x-delimited values.
obstacles:
  - "460x220x160x90"
  - "820x520x130x220"
  - "1280x260x240x120"
  - "1460x720x180x180"

# User-authored 3D preview boxes: "x y z width depth height" in simulator units.
# x/z place the footprint on the ground plane; y is the floor elevation.
obstacles_3d:
  - "-420x0x360x160x90x110"
  - "-40x0x620x130x220x160"
  - "420x0x420x240x120x140"
  - "650x0x860x180x180x180"

camera_3d:
  position: "0x180x-520"       # Used as startup/focal fallback; 3D mode follows the vehicle.
  yaw_degrees: 0
  pitch_degrees: -12
  focal_length: 520

third_person_camera:
  distance: 360                 # W/S zoom the follow camera in/out at runtime.
  height: 145                   # Q/E raise/lower the follow camera.
  orbit_degrees: 0              # A/D orbit around the vehicle; R resets to these values.
  min_distance: 140
  max_distance: 900
  min_height: 45
  max_height: 420

# Procedural 3D vehicle model parts: "local_x local_y local_z width depth height"
# encoded as x-delimited values and attached to the simulated vehicle pose.
vehicle_model_3d:
  - "0x18x0x70x120x26"          # chassis
  - "0x42x-8x46x58x28"         # cabin
  - "-42x12x-38x16x24x24"      # rear-left wheel
  - "42x12x-38x16x24x24"       # rear-right wheel
  - "-42x12x38x16x24x24"       # front-left wheel
  - "42x12x38x16x24x24"        # front-right wheel
  - "0x28x72x30x18x16"         # front marker

range_sensor:
  rays: 41
  fov_degrees: 180
  max_range: 420
  noise_stddev: 2.5
  dropout_rate: 0.03
  random_seed: 42
